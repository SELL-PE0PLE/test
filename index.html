<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейтральный Фоновый Тестер</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 15px;
            margin: 0 0 25px 0;
            color: #fff;
            line-height: 1.4;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #30363d;
            padding-top: 25px;
            margin-top: 25px;
        }

        .track {
            background: #21262d;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border: 2px solid transparent; 
            transition: all 0.15s ease;
        }

        .track:hover {
            background: #30363d;
        }

        /* Четкая синяя обводка, которая теперь переключает сплошные потоки */
        .track.active {
            border-color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player">
        <h2 id="now-playing">Текущий режим:<br>Непрерывный мягкий гул (Авиасалон)</h2>
        
        <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ ФОН</button>

        <div class="playlist">
            <div class="track active" data-type="brown" data-name="Непрерывный мягкий гул (Авиасалон)">✈️ Вариант 1: Глубокий сплошной гул</div>
            <div class="track" data-type="pink" data-name="Шелест водопада или ливня">🌧️ Вариант 2: Сплошной шум дождя</div>
            <div class="track" data-type="white" data-name="Чистый белый шум (Защита от звуков)">📺 Вариант 3: Ровный белый шум</div>
        </div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const nowPlaying = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track');

        let isPlaying = false;
        let activeNoiseType = "brown"; // По умолчанию включаем самый глухой шум
        
        let audioCtx = null;
        let noiseSource = null;
        let gainNode = null;

        // Создание сплошного аудиопотока без циклов и повторений
        function createNoiseBuffer(type) {
            const bufferSize = 2 * 44100; // 2 секунды сплошного звука
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;

                if (type === 'brown') {
                    // Коричневый шум: убирает абсолютно все высокие частоты, оставляя только глубокий мягкий бархатный гул
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    data[i] *= 0.05; // Снижаем исходную резкость
                    b6 = white * 0.115926;
                } else if (type === 'pink') {
                    // Розовый шум: сбалансированный срез частот, звучит точь-в-точь как ровный ливень за окном
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    data[i] *= 0.15;
                    b6 = white * 0.115926;
                } else {
                    // Белый шум: ровный поток на всех частотах, как пустой ТВ-канал
                    data[i] = white * 0.1;
                }
            }
            return buffer;
        }

        function startNoise() {
            stopNoise();
            if (!isPlaying) return;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = createNoiseBuffer(activeNoiseType);
            noiseSource.loop = true; // Зацикливаем сам сплошной поток, а не отдельные удары

            gainNode = audioCtx.createGain();
            // Громкость на максимум для теста, но без перегрузки звуковой карты
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime); 

            noiseSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noiseSource.start();
        }

        function stopNoise() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch(e) {}
                noiseSource.disconnect();
                noiseSource = null;
            }
        }

        // Логика кнопки ВКЛ / ВЫКЛ
        triggerBtn.addEventListener('click', function() {
            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                startNoise();
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ ФОН';
                this.classList.remove('active');
                stopNoise();
            }
        });

        // Железобетонный переход синей обводки и мгновенная смена типа сплошного шума
        tracks.forEach(track => {
            track.addEventListener('click', function() {
                // Смена визуального класса
                tracks.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                // Обновление состояния
                activeNoiseType = this.getAttribute('data-type');
                const trackName = this.getAttribute('data-name');
                nowPlaying.innerHTML = "Текущий режим:<br>" + trackName;

                // Если звук включен — он мгновенно и бесшовно перестроится без щелчков
                if (isPlaying) {
                    startNoise();
                }
            });
        });
    </script>
</body>
</html>
