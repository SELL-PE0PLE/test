<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый Плеер SoundCloud</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-box {
            background: #161b22;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            font-size: 16px;
            color: #fff;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        /* Обертка, чтобы плеер сел красиво скругленным блоком */
        .iframe-container {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
            background: #0d1117;
            height: 166px; /* Высота под классический компактный виджет */
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="player-box">
        <h2>Аудио-стенд проекта</h2>
        <div class="subtitle">Воспроизведение трека с SoundCloud</div>
        
        <div class="iframe-container">
            <!-- Официальный рабочий виджет для трека "у девчонок" -->
            <iframe 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay" 
                src="https://soundcloud.com">
            </iframe>
        </div>
    </div>

</body>
</html>
