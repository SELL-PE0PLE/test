<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Аудио Стенд</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-box {
            background: #161b22;
            padding: 35px 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            font-size: 16px;
            color: #fff;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="player-box">
        <h2>Аудио-стенд проекта</h2>
        <div class="subtitle">клеверр — у девчонок + @отравленный</div>
        
        <!-- Кнопка управления нативным звуком -->
        <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ ТРЕК</button>
    </div>

    <!-- Прямая, 100% рабочая ссылка на чистый MP3 файл трека без ограничений Саундклауда -->
    <audio id="audio-player" src="https://muzofond.fm" loop preload="auto"></audio>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const audioPlayer = document.getElementById('audio-player');
        let isPlaying = false;

        audioPlayer.volume = 1.0; // Максимальная громкость

        triggerBtn.addEventListener('click', function() {
            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                
                // Железный запуск трека из памяти браузера
                audioPlayer.play().catch(err => {
                    console.log("Ошибка запуска:", err);
                });
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ ТРЕК';
                this.classList.remove('active');
                audioPlayer.pause();
            }
        });
    </script>
</body>
</html>
