<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Вариантов Звука — Тестовый Плеер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">
        <div id="disc" class="disc">
            <div class="center-hole"></div>
        </div>
        
        <h2 id="now-playing">Текущий трек: Вариант 1: Суб-бас пила</h2>
        
        <div class="controls">
            <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ ЗВУК</button>
        </div>

        <!-- Контейнер для 30 треков с автоскроллом -->
        <div id="playlist" class="playlist"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
