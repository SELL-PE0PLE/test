<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Рабочий Релакс Плеер</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .disc {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #21262d, #30363d);
            border: 4px solid #30363d;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .disc.playing {
            animation: spin 8s linear infinite;
            background: linear-gradient(45deg, #1f6feb, #238636);
            border-color: #58a6ff;
        }

        .center-hole {
            width: 30px;
            height: 30px;
            background: #0d1117;
            border-radius: 50%;
        }

        h2 {
            font-size: 16px;
            margin: 0 0 20px 0;
            color: #fff;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            margin-bottom: 25px;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #30363d;
            padding-top: 20px;
        }

        .track {
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            border: 2px solid transparent; 
            transition: all 0.15s ease;
        }

        .track:hover {
            background: #30363d;
        }

        /* Синяя четкая обводка, которая гарантированно перемещается */
        .track.active {
            border-color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            font-weight: bold;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player">
        <div id="disc" class="disc">
            <div class="center-hole"></div>
        </div>
        
        <h2 id="now-playing">Текущий трек: Мелодия 1: Акустическая гитара</h2>
        
        <div class="controls">
            <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ МУЗЫКУ</button>
        </div>

        <div class="playlist">
            <div class="track active" data-url="https://soundhelix.com" data-name="Мелодия 1: Акустическая гитара">🎸 Вариант 1: Спокойная гитара</div>
            <div class="track" data-url="https://soundhelix.com" data-name="Мелодия 2: Вечернее фортепиано">🎹 Вариант 2: Мягкие клавиши</div>
            <div class="track" data-url="https://soundhelix.com" data-name="Мелодия 3: Легкий Relax-Фон">🌌 Вариант 3: Расслабляющий фон</div>
        </div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const disc = document.getElementById('disc');
        const nowPlaying = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track');

        let isPlaying = false;
        
        // Создаем глобальный аудиообъект
        let currentAudio = new Audio();
        currentAudio.loop = true;
        currentAudio.volume = 1.0; // Выставлено на 100%

        // Инициализируем стартовый трек по умолчанию из первого элемента
        currentAudio.src = tracks[0].getAttribute('data-url');

        // Логика работы главной кнопки
        triggerBtn.addEventListener('click', function() {
            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                disc.classList.add('playing');
                
                // Запуск аудиопотока
                currentAudio.play().catch(err => {
                    console.log("Ошибка запуска аудио:", err);
                });
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ МУЗЫКУ';
                this.classList.remove('active');
                disc.classList.remove('playing');
                
                // Ставим на паузу
                currentAudio.pause();
            }
        });

        // Железобетонная логика переключения треков и обводок
        tracks.forEach(track => {
            track.addEventListener('click', function() {
                // 1. Полностью убираем обводку у всех элементов
                tracks.forEach(t => t.classList.remove('active'));
                
                // 2. Добавляем синюю обводку именно на нажатый элемент
                this.classList.add('active');

                // 3. Вытаскиваем данные трека
                const trackUrl = this.getAttribute('data-url');
                const trackName = this.getAttribute('data-name');

                // 4. Обновляем текст на экране
                nowPlaying.innerText = "Текущий трек: " + trackName;

                // 5. Меняем источник звука
                currentAudio.pause();
                currentAudio.src = trackUrl;
                currentAudio.volume = 1.0; // Держим громкость на 100%

                // Если плеер уже работал — запускаем новую мелодию автоматически
                if (isPlaying) {
                    currentAudio.play().catch(err => console.log("Ошибка переключения:", err));
                }
            });
        });
    </script>
</body>
</html>
