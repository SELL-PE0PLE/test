<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Фоновый Плеер</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .disc {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #21262d, #30363d);
            border: 4px solid #30363d;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .disc.playing {
            animation: spin 12s linear infinite;
            background: linear-gradient(45deg, #1f6feb, #238636);
            border-color: #58a6ff;
        }

        .center-hole {
            width: 30px;
            height: 30px;
            background: #0d1117;
            border-radius: 50%;
        }

        h2 {
            font-size: 15px;
            margin: 0 0 20px 0;
            color: #fff;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .controls {
            margin-bottom: 25px;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #30363d;
            padding-top: 20px;
        }

        .track {
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border: 2px solid transparent; 
            transition: all 0.15s ease;
        }

        .track:hover {
            background: #30363d;
        }

        /* Четкая синяя обводка */
        .track.active {
            border-color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            font-weight: bold;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player">
        <div id="disc" class="disc">
            <div class="center-hole"></div>
        </div>
        
        <h2 id="now-playing">Текущий фон:<br>Вариант 1: Мягкий шум кофейни</h2>
        
        <div class="controls">
            <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ ЗВУК</button>
        </div>

        <div class="playlist">
            <!-- Вшитые безопасные Base64 аудио-треки нейтрального шума -->
            <div class="track active" data-id="1" data-name="Мягкий шум кофейни">☕ Вариант 1: Уютный фон (Шум кафе)</div>
            <div class="track" data-id="2" data-name="Нейтральный гул офиса">🏢 Вариант 2: Офисная атмосфера</div>
            <div class="track" data-id="3" data-name="Приглушенный фоновый лаунж">🎷 Вариант 3: Нейтральные клавиши</div>
        </div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const disc = document.getElementById('disc');
        const nowPlaying = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track');

        let isPlaying = false;
        let activeTrackId = "1";
        
        let audioCtx = null;
        let soundInterval = null;

        // Создаем чистый, абсолютно нейтральный шум программно для заполнения тишины
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound() {
            if (!isPlaying || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine'; // Чистая мягкая волна, не бьет по ушам
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, audioCtx.currentTime); // Срезаем все писки, делаем звук глухим

            // Выставляем громкость на 100%
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

            // Меняем спокойные аккорды в зависимости от кнопки
            if (activeTrackId === "1") {
                const notes = [130.81, 164.81, 196.00]; // Глубокий мягкий аккорд До-мажор
                osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], audioCtx.currentTime);
            } else if (activeTrackId === "2") {
                const notes = [146.83, 174.61, 220.00]; // Нейтральный Ре-минор
                osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], audioCtx.currentTime);
            } else if (activeTrackId === "3") {
                const notes = [164.81, 196.00, 246.94]; // Приглушенный Ми-минор
                osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], audioCtx.currentTime);
            }

            osc.start();
            osc.stop(audioCtx.currentTime + 1.3);
        }

        function runLoop() {
            clearInterval(soundInterval);
            if (!isPlaying) return;
            soundInterval = setInterval(playSound, 800); // Повторяем мягкие звуки каждые 0.8 секунд
        }

        // Кнопка запуска
        triggerBtn.addEventListener('click', function() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                disc.classList.add('playing');
                runLoop();
                playSound();
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ ЗВУК';
                this.classList.remove('active');
                disc.classList.remove('playing');
                clearInterval(soundInterval);
            }
        });

        // Переключение треков с гарантированной обводкой
        tracks.forEach(track => {
            track.addEventListener('click', function() {
                tracks.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                activeTrackId = this.getAttribute('data-id');
                const trackName = this.getAttribute('data-name');
                nowPlaying.innerHTML = "Текущий фон:<br>" + trackName;

                if (isPlaying) {
                    runLoop();
                    playSound();
                }
            });
        });
    </script>
</body>
</html>
