<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино-Текстуры Фоновый Плеер</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 15px;
            margin: 0 0 25px 0;
            color: #fff;
            line-height: 1.4;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 16px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #30363d;
            padding-top: 25px;
            margin-top: 25px;
        }

        .track {
            background: #21262d;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border: 2px solid transparent; 
            transition: all 0.15s ease;
        }

        .track:hover {
            background: #30363d;
        }

        /* Та самая четкая синяя обводка, которая мгновенно переключает эмбиент */
        .track.active {
            border-color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player">
        <h2 id="now-playing">Текущий фон:<br>Саундтрек 1: Глубокий Космос (Текстура)</h2>
        
        <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ САУНДТРЕК</button>

        <div class="playlist">
            <div class="track active" data-id="interstellar" data-name="Саундтрек 1: Глубокий Космос (Текстура)">🚀 Вариант 1: Космический струнный фон</div>
            <div class="track" data-id="submarina" data-name="Саундтрек 2: Бесконечная Глубина">🌊 Вариант 2: Тягучий басовый гул</div>
            <div class="track" data-id="horizon" data-name="Саундтрек 3: Вечный Горизонт">🌅 Вариант 3: Светлый панорамный эмбиент</div>
        </div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const nowPlaying = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track');

        let isPlaying = false;
        let activePreset = "interstellar";
        
        let audioCtx = null;
        let gainNode = null;
        let activeOscillators = [];

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.7, audioCtx.currentTime); // Плотная, уверенная громкость
            gainNode.connect(audioCtx.destination);
        }

        // Создаем бесконечную, плавно переливающуюся кино-текстуру без единого удара
        function startDroneScore() {
            stopDroneScore();
            if (!isPlaying || !audioCtx) return;

            if (audioCtx.state === 'suspended') audioCtx.resume();

            // Базовые частоты для фундаментальных кино-аккордов (длинные висящие ноты)
            let frequencies = [];
            if (activePreset === "interstellar") {
                // Глубокий, гипнотический космический аккорд (Ля-минор текстура)
                frequencies = [110.00, 165.00, 220.00, 261.63, 329.63]; 
            } else if (activePreset === "submarina") {
                // Сверхглубокий, очень низкий гул океана/подлодки (никаких высоких частот)
                frequencies = [73.42, 110.00, 146.83, 185.00]; 
            } else if (activePreset === "horizon") {
                // Светлый, парящий саундтрек рассвета
                frequencies = [130.81, 196.00, 261.63, 329.63, 392.00]; 
            }

            frequencies.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                // Используем только мягкий синус для создания чистой текстуры
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Фильтр низких частот полностью убирает резкость и писк
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(450, audioCtx.currentTime);

                // Делаем экстремально плавный запуск (Fade-in длиной в 3 секунды!), чтобы не было щелчков
                oscGain.gain.setValueAtTime(0, audioCtx.currentTime);
                oscGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 3.0);

                // Создаем эффект живого "дыхания" звука с помощью низкочастотного генератора (LFO)
                // Он заставляет каждую ноту в аккорде плавно становиться то чуть громче, то тише сама по себе
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                // Разная скорость волнения для каждой ноты, чтобы они не двигались одинаково
                lfo.frequency.setValueAtTime(0.05 + (index * 0.015), audioCtx.currentTime); 
                lfoGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

                lfo.connect(lfoGain);
                lfoGain.connect(oscGain.gain); // Подключаем качание прямо к громкости ноты

                // Собираем цепочку
                osc.connect(filter);
                filter.connect(oscGain);
                oscGain.connect(gainNode);

                osc.start();
                lfo.start();

                // Сохраняем узлы, чтобы потом корректно их выключить
                activeOscillators.push(osc, lfo, oscGain);
            });
        }

        function stopDroneScore() {
            // Плавное затухание перед полной остановкой, чтобы не щелкало по ушам
            activeOscillators.forEach(node => {
                if (node instanceof AudioGainNode) {
                    try { node.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); } catch(e){}
                }
            });

            // Окончательно стопаем генераторы через полсекунды
            setTimeout(() => {
                activeOscillators.forEach(node => {
                    try { node.stop(); } catch(e) {}
                    try { node.disconnect(); } catch(e) {}
                });
                activeOscillators = [];
            }, 500);
        }

        // Кнопка главного управления
        triggerBtn.addEventListener('click', function() {
            initAudio();

            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                startDroneScore();
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ САУНДТРЕК';
                this.classList.remove('active');
                stopDroneScore();
            }
        });

        // Безупречное переключение треков по клику мыши с обновлением синей рамки
        tracks.forEach(track => {
            track.addEventListener('click', function() {
                // Смена активного класса обводки
                tracks.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                // Обновление переменных ТЗ
                activePreset = this.getAttribute('data-id');
                const trackName = this.getAttribute('data-name');
                nowPlaying.innerHTML = "Текущий фон:<br>" + trackName;

                // Если плеер активен — мгновенно перестраиваем аккорд на лету
                if (isPlaying) {
                    startDroneScore();
                }
            });
        });
    </script>
</body>
</html>
