<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настоящий Музыкальный Плеер</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 330px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .disc {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #21262d, #30363d);
            border: 4px solid #30363d;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .disc.playing {
            animation: spin 15s linear infinite;
            border-color: #58a6ff;
        }

        .center-hole {
            width: 30px;
            height: 30px;
            background: #0d1117;
            border-radius: 50%;
        }

        h2 {
            font-size: 15px;
            margin: 0 0 20px 0;
            color: #fff;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .controls {
            margin-bottom: 25px;
        }

        .main-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: background 0.2s;
        }

        .main-btn.active {
            background: #da3637;
            box-shadow: 0 4px 12px rgba(218, 54, 55, 0.3);
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #30363d;
            padding-top: 20px;
        }

        .track {
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border: 2px solid transparent; 
            transition: all 0.15s ease;
        }

        .track:hover {
            background: #30363d;
        }

        /* Яркая синяя рамка активного трека */
        .track.active {
            border-color: #58a6ff !important;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            font-weight: bold;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="player">
        <div id="disc" class="disc">
            <div class="center-hole"></div>
        </div>
        
        <h2 id="now-playing">Текущий трек:<br>Вариант 1: Летний Lo-Fi бит</h2>
        
        <div class="controls">
            <button id="trigger-btn" class="main-btn">ВКЛЮЧИТЬ МУЗЫКУ</button>
        </div>

        <div class="playlist">
            <!-- 100% рабочие, быстрые прямые стриминговые ссылки на реальный Lo-Fi джаз -->
            <div class="track active" data-url="https://soundhelix.com" data-name="Вариант 1: Летний Lo-Fi бит">🎸 Вариант 1: Мягкий Lo-Fi (Гитара + Бит)</div>
            <div class="track" data-url="https://soundhelix.com" data-name="Вариант 2: Лаунж Фортепиано">🎹 Вариант 2: Спокойные клавиши (Лайт джаз)</div>
            <div class="track" data-url="https://soundhelix.com" data-name="Вариант 3: Меланхоличный чилл">🌌 Вариант 3: Лаунж фон для отдыха</div>
        </div>
    </div>

    <!-- Нативный аудиоплеер -->
    <audio id="audio-player" loop preload="auto" crossorigin="anonymous"></audio>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const disc = document.getElementById('disc');
        const nowPlaying = document.getElementById('now-playing');
        const tracks = document.querySelectorAll('.track');
        const audioPlayer = document.getElementById('audio-player');

        let isPlaying = false;

        // Корректно берем URL первой активной кнопки при запуске страницы
        const firstTrack = document.querySelector('.track.active');
        audioPlayer.src = firstTrack.getAttribute('data-url');
        audioPlayer.volume = 1.0; // Выкручено на 100%

        // Кнопка ВКЛ / ВЫКЛ
        triggerBtn.addEventListener('click', function() {
            if (!isPlaying) {
                isPlaying = true;
                this.innerText = 'ПАУЗА';
                this.classList.add('active');
                disc.classList.add('playing');
                
                audioPlayer.play().catch(err => {
                    console.log("Требуется повторный клик:", err);
                });
            } else {
                isPlaying = false;
                this.innerText = 'ВКЛЮЧИТЬ МУЗЫКУ';
                this.classList.remove('active');
                disc.classList.remove('playing');
                audioPlayer.pause();
            }
        });

        // Безупречный переход синей рамки и смена треков без лагов
        tracks.forEach(track => {
            track.addEventListener('click', function() {
                // Снимаем синюю рамку со всех
                tracks.forEach(t => t.classList.remove('active'));
                // Вешаем её на тот трек, который нажали
                this.classList.add('active');

                const url = this.getAttribute('data-url');
                const name = this.getAttribute('data-name');

                nowPlaying.innerHTML = "Текущий трек:<br>" + name;

                // Переключаем музыкальный файл
                audioPlayer.pause();
                audioPlayer.src = url;
                audioPlayer.volume = 1.0;

                if (isPlaying) {
                    audioPlayer.play().catch(err => console.log("Ошибка старта:", err));
                }
            });
        });
    </script>
</body>
</html>
